name: Local application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  CI_RUNTIME_AUTHORIZATION_TESTS: >-
    backend/tests/test_runtime_authorization_integration.py
  CI_AUTHORITY_MODEL_TESTS: >-
    backend/tests/test_authority_model_trials.py
  CI_HUMAN_REVIEW_GROUP_TESTS: >-
    backend/tests/test_authority_trial_cohorts.py
    backend/tests/test_analysis_cohorts.py
  CI_RETAINED_WITHDRAWAL_TESTS: >-
    backend/tests/test_retained_release_withdrawal.py
    backend/tests/test_retained_release_inspection.py
  CI_GRAPH_CANDIDATE_TESTS: >-
    backend/tests/test_final_release_transitions.py
    backend/tests/test_final_graph_candidate.py
  CI_WORKSPACE_SECURITY_TESTS: >-
    backend/tests/test_firm_admin.py
    backend/tests/test_authority_proposals.py
  # Model-cohort cases remain in the full backend remainder. Running them
  # sequentially with x86 workspace/review groups left only 3s of job margin.
  # Keep every case, eight jobs, two workers, current caps and no retries.
  # Start the measured 174-second retained assembly first, so it cannot become
  # a late single-worker tail. Full-suite membership, workers and caps stay.
  CI_FINAL_RELEASE_TESTS: >-
    backend/tests/test_retained_mixed_assembly.py
    backend/tests/test_final_release_authorization.py
    backend/tests/test_final_authorization_postgres.py
    backend/tests/test_final_release_inspection.py
  # Complete CPU-heavy files leave the saturated remainder; none are duplicated.
  CI_GRAPH_RUNTIME_TESTS: >-
    backend/tests/test_declared_graph_assembly.py
    backend/tests/test_graph_b_component_grants.py
    backend/tests/test_release_set_authorization.py
    backend/tests/test_open_validity_publication.py
    backend/tests/test_graph_b_publication.py
    backend/tests/test_graph_b_snapshot.py
  CI_PUBLICATION_TESTS: >-
    backend/tests/test_publication_cli.py
    backend/tests/test_authority_revalidations.py
    backend/tests/test_source_reviews.py
    backend/tests/test_source_review_effort.py
    backend/tests/test_source_analysis_reviews.py
    backend/tests/test_source_context_renewals.py
    backend/tests/test_source_review_readiness.py
    backend/tests/test_portfolio_source_reviews.py
    backend/tests/test_source_context_navigation.py
    backend/tests/test_source_review_lineage.py

jobs:
  backend-and-contracts:
    # Standard native ARM executor; the frontend job retains x86 coverage below.
    # The complete 19-case model-cohort file returns to this existing remainder.
    # Keep the same two pytest workers and the existing test/job deadlines.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CI_ONTOLOGY_PREFLIGHT_TESTS: >-
        backend/tests/test_validation_queries.py
        backend/tests/test_validation_membership.py
        backend/tests/test_ontology_syntax.py
        backend/tests/test_validation_syntax.py
        backend/tests/test_rdfs_identifiers.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install uv==0.8.15
          uv sync --project backend --frozen --extra dev
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint Python
        run: ruff check --config backend/pyproject.toml backend/app backend/tests deploy scripts ontology
      - name: Record nonsecret test runtime characteristics
        run: |
          python - <<'PY'
          import json, os, platform, ssl
          print(json.dumps({"architecture": platform.machine(), "python": platform.python_version(),
                            "available_cpus": len(os.sched_getaffinity(0)), "openssl": ssl.OPENSSL_VERSION}))
          PY
      - name: Check ontology parsing, membership and SHACL work budgets before full suite
        timeout-minutes: 2
        run: |
          read -r -a preflight_tests <<< "$CI_ONTOLOGY_PREFLIGHT_TESTS"
          bash scripts/run_ci_tests.sh pytest "${preflight_tests[@]}" -q
      - name: Test registered local-model authority trials
        timeout-minutes: 2
        run: |
          read -r -a model_trial_tests <<< "$CI_AUTHORITY_MODEL_TESTS"
          bash scripts/run_ci_tests.sh pytest "${model_trial_tests[@]}" -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=20
      - name: Test backend
        timeout-minutes: 18
        run: |
          read -r -a runtime_tests <<< "$CI_RUNTIME_AUTHORIZATION_TESTS"
          read -r -a preflight_tests <<< "$CI_ONTOLOGY_PREFLIGHT_TESTS"
          read -r -a publication_tests <<< "$CI_PUBLICATION_TESTS"
          read -r -a final_release_tests <<< "$CI_FINAL_RELEASE_TESTS"
          read -r -a retained_withdrawal_tests <<< "$CI_RETAINED_WITHDRAWAL_TESTS"
          read -r -a graph_candidate_tests <<< "$CI_GRAPH_CANDIDATE_TESTS"
          read -r -a workspace_tests <<< "$CI_WORKSPACE_SECURITY_TESTS"
          read -r -a human_review_tests <<< "$CI_HUMAN_REVIEW_GROUP_TESTS"
          read -r -a model_trial_tests <<< "$CI_AUTHORITY_MODEL_TESTS"
          read -r -a graph_runtime_tests <<< "$CI_GRAPH_RUNTIME_TESTS"
          ignore_args=()
          for path in "${runtime_tests[@]}" "${preflight_tests[@]}" "${publication_tests[@]}" "${final_release_tests[@]}" "${retained_withdrawal_tests[@]}" "${graph_candidate_tests[@]}" "${workspace_tests[@]}" "${human_review_tests[@]}" "${model_trial_tests[@]}" "${graph_runtime_tests[@]}"; do
            ignore_args+=("--ignore=$path")
          done
          bash scripts/run_ci_tests.sh pytest backend/tests "${ignore_args[@]}" -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=30
      - name: Test deployment contracts
        run: python -m unittest discover -s deploy -p 'test_*.py'
      - name: Validate RDF and SHACL contract
        run: python scripts/validate_ontology.py
      - name: Validate R01 planning contracts (not legal or runtime approval)
        run: python scripts/qualify_roadmap.py check qualification
      - name: Compare actual synthetic extraction with independent reference
        run: |
          python scripts/build_calibration_fixture.py "$RUNNER_TEMP/r01-calibration"
          python scripts/qualify_roadmap.py calibrate "$RUNNER_TEMP/r01-calibration"
      - name: Verify a dossier-bound synthetic calibration study
        run: |
          python scripts/build_calibration_study_fixture.py "$RUNNER_TEMP/r01-study" --dossier-dir qualification
          python scripts/qualify_roadmap.py study "$RUNNER_TEMP/r01-study/study" --dossier-dir qualification --artifacts-dir "$RUNNER_TEMP/r01-study/artifacts"
      - name: Verify source-linked synthetic reference intake without legal approval
        run: |
          python scripts/build_reference_case_fixture.py "$RUNNER_TEMP/r01-reference-cases"
          python scripts/qualify_reference_cases.py "$RUNNER_TEMP/r01-reference-cases/intake" --artifacts-dir "$RUNNER_TEMP/r01-reference-cases/artifacts" --source-catalog-dir "$RUNNER_TEMP/r01-reference-cases/catalog"
      - name: Validate Compose without reading a local env file
        env:
          LA_POSTGRES_PASSWORD: ci-placeholder-not-a-real-secret
          LA_ENCRYPTION_KEY: ci-placeholder-not-a-real-secret
          LA_BOOTSTRAP_USERNAME: ci-operator
          LA_BOOTSTRAP_PASSWORD: ci-placeholder-not-a-real-secret
          LA_GATEWAY_TOKEN: ci-placeholder-not-a-real-secret
          LA_EXTRACTION_TOKEN: ci-placeholder-not-a-real-secret-at-least-32
        run: docker compose --env-file /dev/null --profile research --profile native-provider config --quiet

  postgres-snapshot-concurrency:
    # The unchanged CPU-heavy runtime guard exceeded the x86 job budget even
    # after all 95 cases passed. Use the already-qualified native ARM executor,
    # keeping every case, two workers and the original five-minute deadline.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: lawyer_snapshot_test
          POSTGRES_USER: snapshot_test
          POSTGRES_PASSWORD: disposable-ci-snapshot-only
        ports:
          - 5432/tcp
        # Disposable race data only. Keep real WAL/fsync/commit semantics while
        # avoiding repeated child-database checkpoints on the runner disk.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,nosuid,size=512m
          --health-cmd "pg_isready -U snapshot_test -d lawyer_snapshot_test"
          --health-interval 1s --health-timeout 1s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install uv==0.8.15
          uv sync --project backend --frozen --extra dev
      - name: Test real PostgreSQL review and research races in isolated child databases
        env:
          LA_TEST_POSTGRES_URL: postgresql+psycopg://snapshot_test:disposable-ci-snapshot-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/lawyer_snapshot_test
        # Every test owns a random child database. Start the costly runtime,
        # authorization and declared-assembly groups early to bound the tail.
        # Keep all 95 cases, two workers, real row-lock races and the five-minute
        # cap. Temporary storage changes no PostgreSQL durability settings.
        run: |
          backend/.venv/bin/python - <<'PYSQL'
          import os, platform, ssl, psycopg
          assert platform.machine() in {'aarch64', 'arm64'}, platform.machine()
          print('Runtime:', platform.machine(), platform.python_version(), ssl.OPENSSL_VERSION, 'cpus', len(os.sched_getaffinity(0)))
          url = os.environ['LA_TEST_POSTGRES_URL'].replace('postgresql+psycopg://', 'postgresql://', 1)
          with psycopg.connect(url) as connection:
              settings = dict(connection.execute("SELECT name, setting FROM pg_settings WHERE name IN ('fsync', 'full_page_writes', 'synchronous_commit')"))
          assert settings == {'fsync': 'on', 'full_page_writes': 'on', 'synchronous_commit': 'on'}, settings
          print('Disposable PostgreSQL settings:', settings)
          PYSQL
          read -r -a runtime_tests <<< "$CI_RUNTIME_AUTHORIZATION_TESTS"
          bash scripts/run_ci_tests.sh backend/.venv/bin/pytest "${runtime_tests[@]}" backend/tests/test_set_authorization_postgres.py backend/tests/test_declared_assembly_postgres.py backend/tests/test_snapshot_set_postgres.py backend/tests/test_mixed_graph_snapshot_postgres.py backend/tests/test_research_jobs_postgres.py backend/tests/test_content_scope_postgres.py backend/tests/test_human_workflow_postgres.py -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=20

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # Use the existing runner's spare capacity; groups are disjoint and budgets unchanged.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workspace contract dependencies
        run: |
          python -m pip install uv==0.8.15
          uv sync --project backend --frozen --extra dev
      - name: Test workspace permission and proposal contracts
        timeout-minutes: 2
        run: |
          read -r -a workspace_tests <<< "$CI_WORKSPACE_SECURITY_TESTS"
          bash scripts/run_ci_tests.sh backend/.venv/bin/pytest "${workspace_tests[@]}" -q -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=10
      # The real runtime authorization case returns to the backend partition,
      # whose measured margin protects this runner's five-minute budget.
      - name: Test confidential human review groups
        timeout-minutes: 3
        run: |
          read -r -a human_review_tests <<< "$CI_HUMAN_REVIEW_GROUP_TESTS"
          bash scripts/run_ci_tests.sh backend/.venv/bin/pytest "${human_review_tests[@]}" -q -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=10

  final-release-authorization:
    # Existing jobs are within 30 seconds of their caps. New whole-release
    # lifecycle/concurrency contracts are isolated, not added to the 18-minute
    # backend step or granted a longer existing deadline. No automatic retries.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snapshot_test
          POSTGRES_PASSWORD: disposable-ci-snapshot-only
          POSTGRES_DB: lawyer_snapshot_test
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U snapshot_test -d lawyer_snapshot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install uv==0.8.15
          uv sync --project backend --frozen --extra dev
      - name: Test whole-release permission, transitions and real concurrent reads
        # Include read-only reconciliation in this existing six-minute job.
        # The hard job cap, two workers and no-retry policy remain unchanged.
        timeout-minutes: 6
        env:
          LA_TEST_POSTGRES_URL: postgresql+psycopg://snapshot_test:disposable-ci-snapshot-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/lawyer_snapshot_test
        run: |
          read -r -a final_release_tests <<< "$CI_FINAL_RELEASE_TESTS"
          bash scripts/run_ci_tests.sh backend/.venv/bin/pytest "${final_release_tests[@]}" -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=20

  retained-release-withdrawal:
    # Measured withdrawal reconstruction exhausted the frontend's five-minute
    # cap. Keep this complete group disjoint instead of retrying whole suites or
    # extending existing deadlines. No PostgreSQL service is needed here.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install uv==0.8.15
          uv sync --project backend --frozen --extra dev
      - name: Test conjunctive release withdrawal and complete retained budgets
        timeout-minutes: 3
        run: |
          read -r -a withdrawal_tests <<< "$CI_RETAINED_WITHDRAWAL_TESTS"
          bash scripts/run_ci_tests.sh backend/.venv/bin/pytest "${withdrawal_tests[@]}" -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=10

  graph-candidate-contracts:
    # A 67-second transition case previously consumed the final job's setup
    # headroom. Run it first alongside candidate checks; keep every assertion,
    # seven jobs, two workers and all existing deadlines without retry.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install uv==0.8.15
          uv sync --project backend --frozen --extra dev
      - name: Test complete final graph candidate contracts
        timeout-minutes: 3
        run: |
          read -r -a candidate_tests <<< "$CI_GRAPH_CANDIDATE_TESTS"
          bash scripts/run_ci_tests.sh backend/.venv/bin/pytest "${candidate_tests[@]}" -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=10

  source-publication-contracts:
    # PostgreSQL races passed in 208s and publication checks in 72s, but setup
    # pushed their shared five-minute job over its cap. Keep both complete groups
    # disjoint; preserve every existing cap, two workers and no automatic retry.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install uv==0.8.15
          uv sync --project backend --frozen --extra dev
      - name: Test signed publication and retained-source renewal
        timeout-minutes: 3
        run: |
          read -r -a publication_tests <<< "$CI_PUBLICATION_TESTS"
          bash scripts/run_ci_tests.sh backend/.venv/bin/pytest "${publication_tests[@]}" -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=20


  graph-runtime-contracts:
    # The 3907-case backend lane exhausted its unchanged 18-minute deadline.
    # Run these four complete files exactly once in a separate bounded lane.
    # Keep all existing job/step caps, native ARM and exactly two workers.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install uv==0.8.15
          uv sync --project backend --frozen --extra dev
      - name: Test complete graph assembly, grants and runtime authorization
        timeout-minutes: 6
        run: |
          read -r -a graph_runtime_tests <<< "$CI_GRAPH_RUNTIME_TESTS"
          bash scripts/run_ci_tests.sh backend/.venv/bin/pytest "${graph_runtime_tests[@]}" -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=20
