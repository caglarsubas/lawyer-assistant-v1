        timeout-minutes: 2
        run: |
          read -r -a capacity_tests <<< "$CI_BACKEND_CAPACITY_TESTS"
          bash scripts/run_ci_tests.sh backend/.venv/bin/pytest "${capacity_tests[@]}" -q -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=10 -rA

