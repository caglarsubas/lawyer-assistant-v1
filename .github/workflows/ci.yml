name: Local application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  CI_SOURCE_REVIEW_TESTS: >-
    backend/tests/test_source_reviews.py
  CI_HISTORY_BINDING_TESTS: >-
    backend/tests/test_provision_mappings.py
  CI_CANDIDATE_FOCUS_TESTS: >-
    backend/tests/test_analysis_focus.py
  CI_DISPOSITION_RESTART_TESTS: >-
    backend/tests/test_disposition_journal_reconciliation.py
  CI_PUBLICATION_PLANNING_TESTS: >-
    backend/tests/test_open_validity_publication.py
    backend/tests/test_planning_journal_reconciliation.py
    backend/tests/test_release_authorization.py
    backend/tests/test_retained_release_inspection.py
  CI_FAST_GUARD_TESTS: >-
    backend/tests/test_ci_history_review_pair.py
  CI_RUNTIME_AUTHORIZATION_TESTS: >-
    backend/tests/test_runtime_authorization_integration.py
  CI_BACKEND_CAPACITY_TESTS: >-
    backend/tests/test_journal_backup_readiness.py
    backend/tests/test_firm_admin.py
  CI_AUTHORITY_MODEL_TESTS: >-
    backend/tests/test_authority_model_trials.py
  # Workspace, cohort and human-review groups reuse existing ARM capacity.
  # Frontend retains its full x86 TypeScript/build/browser-unit coverage.
  # No cases, jobs, workers, deadlines, fixtures or assertions are removed.
  # Preserve full x86 coverage; measured model-cohort work stays on ARM.
  # Keep analysis/feedback on their measured x86 pair. The exited history
  # pair runs two bounded serial groups, avoiding a delayed inspection tail.
  CI_HUMAN_REVIEW_GROUP_TESTS: >-
    backend/tests/test_analysis_cohorts.py
    backend/tests/test_analysis_feedback.py
  CI_HISTORY_GUARD_TESTS: >-
    backend/tests/test_ci_authority_partition.py
    backend/tests/test_ci_budgeted_deployment.py
    backend/tests/test_ci_retained_history.py
  CI_HISTORY_INSPECTION_TESTS: >-
    backend/tests/test_final_release_inspection.py
  CI_RETAINED_WITHDRAWAL_TESTS: >-
    backend/tests/test_authority_proposals.py
  CI_GRAPH_CANDIDATE_TESTS: >-
    backend/tests/test_final_graph_candidate.py
    backend/tests/test_staged_receipt_adapter.py
    backend/tests/test_native_receipt_stage.py
    backend/tests/test_native_receipt_http.py
    backend/tests/test_native_receipt_faults.py
    backend/tests/test_receipt_recovery_planning.py
  # Model-cohort cases remain in the full backend remainder. Running them
  # sequentially with x86 workspace/review groups left only 3s of job margin.
  # Keep every case, eight jobs, two workers, current caps and no retries.
  # Start the measured 174-second retained assembly first, so it cannot become
  # a late single-worker tail. Full-suite membership, workers and caps stay.
  CI_FINAL_RELEASE_TESTS: >-
    backend/tests/test_retained_mixed_assembly.py
    backend/tests/test_final_release_authorization.py
    backend/tests/test_final_authorization_postgres.py
  CI_RECOVERY_QUALIFICATION_TESTS: >-
    backend/tests/test_retained_release_withdrawal.py
    backend/tests/test_copy_recovery_disposition.py
    backend/tests/test_journal_copy_reconciliation.py
    backend/tests/test_source_review_lineage.py
  # Complete CPU-heavy files leave the saturated remainder; none are duplicated.
  # A dedicated bounded job holds complete publication/planning files.
  # Keep remaining graph files complete and the lighter Graph B snapshot in backend.
  CI_GRAPH_RUNTIME_TESTS: >-
    backend/tests/test_graph_b_component_grants.py
    backend/tests/test_public_sources.py
    backend/tests/test_declared_graph_assembly.py
    backend/tests/test_release_set_authorization.py
  # Complete expensive review files are disjoint from the backend remainder.
  # Withdrawal retains retention18; the dedicated publication/planning job
  # holds authorization49 and open-validity4. Preserve every complete file, pair/cap and exclusion.
  CI_AUTHORITY_COHORT_TESTS: >-
    backend/tests/test_authority_model_cohorts.py
  CI_BACKEND_REVIEW_TESTS: >-
    backend/tests/test_authority_trial_cohorts.py
    backend/tests/test_journal_materialization.py
  # Complete lighter files reuse measured native ARM history/withdrawal reserve.
  # Sequential workers start only after both history workers have exited.
  # Rejected review/frontend layouts are retained; no caps or floors increase.
  CI_RECEIPT_RETENTION_TESTS: >-
    backend/tests/test_private_inventory_receipts.py
  CI_PUBLICATION_TESTS: >-
    backend/tests/test_publication_cli.py
    backend/tests/test_authority_revalidations.py
    backend/tests/test_source_review_effort.py
    backend/tests/test_source_analysis_reviews.py
    backend/tests/test_source_context_renewals.py
    backend/tests/test_source_review_readiness.py
    backend/tests/test_portfolio_source_reviews.py
    backend/tests/test_source_context_navigation.py

jobs:
  backend-and-contracts:
    # Standard native ARM executor; the frontend job retains x86 coverage below.
    # Cohort, metadata and workspace work uses disjoint existing ARM reserves.
    # Keep the same two pytest workers and the existing test/job deadlines.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 19
    env:
      CI_ONTOLOGY_PREFLIGHT_TESTS: >-
        backend/tests/test_validation_queries.py
        backend/tests/test_validation_membership.py
        backend/tests/test_ontology_syntax.py
        backend/tests/test_validation_syntax.py
        backend/tests/test_rdfs_identifiers.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/uv.lock
            .github/scripts/install-uv.sh
      - name: Install test dependencies
        timeout-minutes: 1
        run: |
          timeout --kill-after=2s 20s bash .github/scripts/install-uv.sh
          uv_path=$(tail -n 1 "$GITHUB_PATH")/uv
          UV_HTTP_TIMEOUT=10 UV_HTTP_RETRIES=0 timeout --kill-after=2s 20s "$uv_path" sync --project backend --frozen --extra dev
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint Python
        run: |
          ruff check --config backend/pyproject.toml backend/app backend/tests deploy scripts ontology
          read -r -a fast_guard_tests <<< "$CI_FAST_GUARD_TESTS"
          timeout --kill-after=2s 30s bash scripts/run_ci_tests.sh backend/.venv/bin/pytest "${fast_guard_tests[@]}" -q -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1
      # Retain locked Node/dependency preparation for existing contract checks.
      # Its single build uses the newly released backend reserve.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Node contract dependencies
        timeout-minutes: 1
        run: npm ci --prefer-offline --no-audit --no-fund --fetch-retries=1 --fetch-timeout=15000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=3000
        working-directory: frontend
      # The unchanged build reuses backend reserve released by slices 4 and 9.
      # Keep it single and sequential; the full x86 Vitest suite stays intact.
      - run: npm run build
        working-directory: frontend
      # Authenticated contracts run once before pytest, with at most two workers.
      # Retained-worker overlap and measured exceptions remove the serial tail.
      # Keep the frontend lanes' timing reserve, with no additional executor,
      # concurrent worker or longer job/test deadline.
      - name: Test manifest-bound authenticated qualification
        timeout-minutes: 2
        run: bash scripts/run_ci_contracts.sh backend/.venv/bin/python scripts/run_ci_retained_deployment.py --shard=3 --workers=2 --report=${{ runner.temp }}/deployment-reader-results.json
      # Reuse the backend pair sequentially; every former step keeps its cap.
      - name: Test manifest-bound reader lifecycle slice 5
        timeout-minutes: 1
        run: bash scripts/run_ci_contracts.sh backend/.venv/bin/python scripts/run_ci_deployment_shard.py --shard=5 --workers=2 --report=${{ runner.temp }}/deployment-reader-lifecycle-5.json
      - name: Test manifest-bound reader lifecycle slice 6
        timeout-minutes: 1
        run: bash scripts/run_ci_contracts.sh backend/.venv/bin/python scripts/run_ci_deployment_shard.py --shard=6 --workers=2 --report=${{ runner.temp }}/deployment-reader-lifecycle-6.json
      - name: Test manifest-bound reader namespace slice
        timeout-minutes: 1
        run: bash scripts/run_ci_contracts.sh backend/.venv/bin/python scripts/run_ci_deployment_shard.py --shard=7 --workers=2 --report=${{ runner.temp }}/deployment-namespace-results.json
      - name: Record nonsecret test runtime characteristics
        run: |
          python - <<'PY'
          import json, os, platform, ssl
          print(json.dumps({"architecture": platform.machine(), "python": platform.python_version(),
                            "available_cpus": len(os.sched_getaffinity(0)), "openssl": ssl.OPENSSL_VERSION}))
          PY
      - name: Check ontology parsing, membership and SHACL work budgets before full suite
        timeout-minutes: 2
        run: |
          read -r -a preflight_tests <<< "$CI_ONTOLOGY_PREFLIGHT_TESTS"
          bash scripts/run_ci_tests.sh pytest "${preflight_tests[@]}" -q
      # The R01 dossier is a closed five-file inventory. Reject misplaced files
      # before the costly backend suite; keep this same gate exactly once.
      - name: Validate R01 planning contracts (not legal or runtime approval)
        run: python scripts/qualify_roadmap.py check qualification
      - name: Test backend
        timeout-minutes: 16
        run: |
          read -r -a source_review_tests <<< "$CI_SOURCE_REVIEW_TESTS"
          read -r -a history_binding_tests <<< "$CI_HISTORY_BINDING_TESTS"
          read -r -a disposition_restart_tests <<< "$CI_DISPOSITION_RESTART_TESTS"
          read -r -a focus_tests <<< "$CI_CANDIDATE_FOCUS_TESTS"
          read -r -a publication_planning_tests <<< "$CI_PUBLICATION_PLANNING_TESTS"
          read -r -a recovery_qualification_tests <<< "$CI_RECOVERY_QUALIFICATION_TESTS"
          read -r -a fast_guard_tests <<< "$CI_FAST_GUARD_TESTS"
          read -r -a runtime_tests <<< "$CI_RUNTIME_AUTHORIZATION_TESTS"
          read -r -a capacity_tests <<< "$CI_BACKEND_CAPACITY_TESTS"
          read -r -a preflight_tests <<< "$CI_ONTOLOGY_PREFLIGHT_TESTS"
          read -r -a publication_tests <<< "$CI_PUBLICATION_TESTS"
          read -r -a final_release_tests <<< "$CI_FINAL_RELEASE_TESTS"
          read -r -a retained_withdrawal_tests <<< "$CI_RETAINED_WITHDRAWAL_TESTS"
          read -r -a graph_candidate_tests <<< "$CI_GRAPH_CANDIDATE_TESTS"
          read -r -a human_review_tests <<< "$CI_HUMAN_REVIEW_GROUP_TESTS"
          read -r -a history_guard_tests <<< "$CI_HISTORY_GUARD_TESTS"
          read -r -a history_inspection_tests <<< "$CI_HISTORY_INSPECTION_TESTS"
          read -r -a model_trial_tests <<< "$CI_AUTHORITY_MODEL_TESTS"
          read -r -a graph_runtime_tests <<< "$CI_GRAPH_RUNTIME_TESTS"
          read -r -a backend_review_tests <<< "$CI_BACKEND_REVIEW_TESTS"
          read -r -a receipt_retention_tests <<< "$CI_RECEIPT_RETENTION_TESTS"
          read -r -a authority_cohort_tests <<< "$CI_AUTHORITY_COHORT_TESTS"
          ignore_args=()
          for path in "${source_review_tests[@]}" "${history_binding_tests[@]}" "${disposition_restart_tests[@]}" "${focus_tests[@]}" "${publication_planning_tests[@]}" "${recovery_qualification_tests[@]}" "${fast_guard_tests[@]}" "${runtime_tests[@]}" "${capacity_tests[@]}" "${preflight_tests[@]}" "${publication_tests[@]}" "${final_release_tests[@]}" "${retained_withdrawal_tests[@]}" "${graph_candidate_tests[@]}" "${human_review_tests[@]}" "${history_guard_tests[@]}" "${history_inspection_tests[@]}" "${model_trial_tests[@]}" "${graph_runtime_tests[@]}" "${backend_review_tests[@]}" "${receipt_retention_tests[@]}" "${authority_cohort_tests[@]}"; do
            ignore_args+=("--ignore=$path")
          done
          bash scripts/run_ci_tests.sh pytest backend/tests "${ignore_args[@]}" -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=30 -rA
      - name: Validate RDF and SHACL contract
        run: python scripts/validate_ontology.py
      - name: Compare actual synthetic extraction with independent reference
        run: |
          python scripts/build_calibration_fixture.py "$RUNNER_TEMP/r01-calibration"
          python scripts/qualify_roadmap.py calibrate "$RUNNER_TEMP/r01-calibration"
      - name: Verify a dossier-bound synthetic calibration study
        run: |
          python scripts/build_calibration_study_fixture.py "$RUNNER_TEMP/r01-study" --dossier-dir qualification
          python scripts/qualify_roadmap.py study "$RUNNER_TEMP/r01-study/study" --dossier-dir qualification --artifacts-dir "$RUNNER_TEMP/r01-study/artifacts"
      - name: Verify source-linked synthetic reference intake without legal approval
        run: |
          python scripts/build_reference_case_fixture.py "$RUNNER_TEMP/r01-reference-cases"
          python scripts/qualify_reference_cases.py "$RUNNER_TEMP/r01-reference-cases/intake" --artifacts-dir "$RUNNER_TEMP/r01-reference-cases/artifacts" --source-catalog-dir "$RUNNER_TEMP/r01-reference-cases/catalog"
      - name: Validate Compose without reading a local env file
        env:
          LA_POSTGRES_PASSWORD: ci-placeholder-not-a-real-secret
          LA_ENCRYPTION_KEY: ci-placeholder-not-a-real-secret
          LA_BOOTSTRAP_USERNAME: ci-operator
          LA_BOOTSTRAP_PASSWORD: ci-placeholder-not-a-real-secret
          LA_GATEWAY_TOKEN: ci-placeholder-not-a-real-secret
          LA_EXTRACTION_TOKEN: ci-placeholder-not-a-real-secret-at-least-32
        run: docker compose --env-file /dev/null --profile research --profile native-provider config --quiet

  backend-review-contracts:
    # Isolate measured cohort/review CPU work instead of saturating the remainder.
    # Exactly the same files run once with two workers; existing caps stay intact.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/uv.lock
            .github/scripts/install-uv.sh
      - name: Install locked review dependencies
        timeout-minutes: 1
        run: |
          timeout --kill-after=2s 20s bash .github/scripts/install-uv.sh
          uv_path=$(tail -n 1 "$GITHUB_PATH")/uv
          UV_HTTP_TIMEOUT=10 UV_HTTP_RETRIES=0 timeout --kill-after=2s 20s "$uv_path" sync --project backend --frozen --extra dev
      - name: Validate closed deployment inventory and measured budgets
        run: |
          backend/.venv/bin/python scripts/run_ci_retained_deployment.py --plan-only
          backend/.venv/bin/python scripts/ci_authority_cohorts.py --check-workflow-arrays
      - name: Test complete backend review and cohort files
        timeout-minutes: 5
        run: |
          read -r -a backend_review_tests <<< "$CI_BACKEND_REVIEW_TESTS"
          read -r -a authority_cohort_tests <<< "$CI_AUTHORITY_COHORT_TESTS"
          bash scripts/run_ci_tests.sh backend/.venv/bin/python -m pytest -p scripts.ci_authority_cohorts --authority-cohort-lane=review "${authority_cohort_tests[@]}" "${backend_review_tests[@]}" -q -n 2 --dist worksteal --max-worker-restart=0 --maxfail=1 --durations=20

      # Reuse the same pair after review tests; no overlap with the x86 UI.
      - name: Test complete manifest-bound assignment 1
        timeout-minutes: 3
        run: bash scripts/run_ci_contracts.sh backend/.venv/bin/python scripts/run_ci_budgeted_deployment.py --shard=1 --workers=2 --report=${{ runner.temp }}/deployment-review-results.json

      # Complete slice 4 on qualified native ARM after the review workers exit.
      # Its original one-minute cap and two-worker ceiling remain unchanged.
      - name: Test manifest-bound reader lifecycle slice 4
        timeout-minutes: 1
        run: bash scripts/run_ci_contracts.sh backend/.venv/bin/python scripts/run_ci_deployment_shard.py --shard=4 --workers=2 --report=${{ runner.temp }}/deployment-reader-lifecycle-4.json


  postgres-snapshot-concurrency:
    # The unchanged CPU-heavy runtime guard exceeded the x86 job budget even
    # after all 95 cases passed. Use the already-qualified native ARM executor,
    # keeping every case, two workers and the original five-minute deadline.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: lawyer_snapshot_test
          POSTGRES_USER: snapshot_test
          POSTGRES_PASSWORD: disposable-ci-snapshot-only
        ports:
          - 5432/tcp
        # Disposable race data only. Keep real WAL/fsync/commit semantics while
        # avoiding repeated child-database checkpoints on the runner disk.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,nosuid,size=512m
          --health-cmd "pg_isready -U snapshot_test -d lawyer_snapshot_test"
          --health-interval 1s --health-timeout 1s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/uv.lock
            .github/scripts/install-uv.sh
      - name: Install test dependencies
        timeout-minutes: 1
        run: |
          timeout --kill-after=2s 20s bash .github/scripts/install-uv.sh
          uv_path=$(tail -n 1 "$GITHUB_PATH")/uv
          UV_HTTP_TIMEOUT=10 UV_HTTP_RETRIES=0 timeout --kill-after=2s 20s "$uv_path" sync --project backend --frozen --extra dev
      - name: Test real PostgreSQL review and research races in isolated child databases
        env:
          LA_TEST_POSTGRES_URL: postgresql+psycopg://snapshot_test:disposable-ci-snapshot-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/lawyer_snapshot_test
        # Every test owns a random child database. Start the costly runtime,
        # authorization and declared-assembly groups early to bound the tail.
        # Keep all 95 cases, two workers, real row-lock races and the five-minute
        # cap. Temporary storage changes no PostgreSQL durability settings.
        run: |
          backend/.venv/bin/python - <<'PYSQL'
          import os, platform, ssl, psycopg
          assert platform.machine() in {'aarch64', 'arm64'}, platform.machine()
          print('Runtime:', platform.machine(), platform.python_version(), ssl.OPENSSL_VERSION, 'cpus', len(os.sched_getaffinity(0)))
          url = os.environ['LA_TEST_POSTGRES_URL'].replace('postgresql+psycopg://', 'postgresql://', 1)
          with psycopg.connect(url) as connection:
              settings = dict(connection.execute("SELECT name, setting FROM pg_settings WHERE name IN ('fsync', 'full_page_writes', 'synchronous_commit')"))
          assert settings == {'fsync': 'on', 'full_page_writes': 'on', 'synchronous_commit': 'on'}, settings
          print('Disposable PostgreSQL settings:', settings)
          PYSQL
          read -r -a runtime_tests <<< "$CI_RUNTIME_AUTHORIZATION_TESTS"
          bash scripts/run_ci_tests.sh backend/.venv/bin/pytest "${runtime_tests[@]}" backend/tests/test_set_authorization_postgres.py backend/tests/test_declared_assembly_postgres.py backend/tests/test_snapshot_set_postgres.py backend/tests/test_mixed_graph_snapshot_postgres.py backend/tests/test_research_jobs_postgres.py backend/tests/test_content_scope_postgres.py backend/tests/test_human_workflow_postgres.py -n 2 --dist load --maxschedchunk=1 --max-worker-restart=0 --maxfail=1 --durations=20



  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        timeout-minutes: 1
        run: npm ci --prefer-offline --no-audit --no-fund --fetch-retries=1 --fetch-timeout=15000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=3000
        working-directory: frontend
      - name: Verify complete disjoint frontend discovery
        run: node scripts/verify_frontend_shards.mjs
      # Contract work left this job; use its existing two-worker budget for
      # isolated x86 Vitest files. History keeps its one-plus-one pairing.
      - name: Test complete frontend shard
        run: node node_modules/vitest/vitest.mjs run --pool=threads --maxWorkers=2 --shard=1/2 --reporter=default --reporter=json --outputFile=${{ runner.temp }}/frontend-results.json
        working-directory: frontend
      - name: Verify executed frontend shard
        run: node scripts/verify_frontend_shards.mjs "${{ runner.temp }}/frontend-results.json" 1

      # Vitest has exited. Reuse its existing pair for the bounded deployment
      # slice; the complete human-review file uses review-job reserve.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/uv.lock
            .github/scripts/install-uv.sh
      - name: Install locked frontend contract dependencies
        timeout-minutes: 1
        run: |
          timeout --kill-after=2s 20s bash .github/scripts/install-uv.sh
          uv_path=$(tail -n 1 "$GITHUB_PATH")/uv
          UV_HTTP_TIMEOUT=10 UV_HTTP_RETRIES=0 timeout --kill-after=2s 20s "$uv_path" sync --project backend --frozen --extra dev

      # The bounded metadata contract slices reuse the same exited pair.
      - name: Test manifest-bound review headroom slice 8
        timeout-minutes: 1
        run: bash scripts/run_ci_contracts.sh backend/.venv/bin/python scripts/run_ci_deployment_shard.py --shard=8 --workers=2 --report=${{ runner.temp }}/deployment-review-headroom-8.json

  frontend-history:
    # Growing history contracts exceeded the single frontend lane's reserve.
    # Built-in hash sharding preserves all files and per-file isolation. Each
    # lane retains two workers and the five-minute cap; build runs only once.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        timeout-minutes: 1
        run: npm ci --prefer-offline --no-audit --no-fund --fetch-retries=1 --fetch-timeout=15000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=3000
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/uv.lock
            .github/scripts/install-uv.sh
      - name: Install locked deployment-contract dependencies
        timeout-minutes: 1
        run: |
          timeout --kill-after=2s 20s bash .github/scripts/install-uv.sh
          uv_path=$(tail -n 1 "$GITHUB_PATH")/uv
          UV_HTTP_TIMEOUT=10 UV_HTTP_RETRIES=0 timeout --kill-after=2s 20s "$uv_path" sync --project backend --frozen --extra dev
      # One Vitest worker and one complete-manifest contract shard per lane.
      # Both existing lanes retain two workers and all test IDs execute once.
      - name: Test history and deployment contracts within two workers
        run: |
          python scripts/run_ci_retained_history_workers.py --executor python scripts/run_ci_history_workers.py \
            node node_modules/vitest/vitest.mjs run --pool=threads --maxWorkers=1 --shard=2/2 --reporter=default --reporter=json --outputFile=${{ runner.temp }}/frontend-results.json \
            ::: bash scripts/run_ci_contracts.sh backend/.venv/bin/python scripts/run_ci_deployment_shard.py --shard=2 --report=${{ runner.temp }}/deployment-results.json
      - name: Verify executed frontend shard
        run: node scripts/verify_frontend_shards.mjs "${{ runner.temp }}/frontend-results.json" 2

  final-release-authorization:
    # Whole-release lifecycle, inspection and real concurrency stay together.
    # The single build uses backend reserve instead of this measured thin tail.
    # Original deadlines, workers, inventories and no-retry policy remain.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snapshot_test
          POSTGRES_PASSWORD: disposable-ci-snapshot-only
          POSTGRES_DB: lawyer_snapshot_test
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U snapshot_test -d lawyer_snapshot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
