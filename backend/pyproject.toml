[project]
name = "lawyer-assistant"
version = "0.1.0"
description = "Local, evidence-grounded Turkish legal preparation workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "cryptography>=44,<47", "python-multipart>=0.0.20,<1", "rdflib>=7.1,<8",
  "pyshacl>=0.30,<1", "pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4",
  "Pillow>=11,<13", "pytesseract>=0.3.13,<1", "reportlab>=4,<5",
  "python-pptx>=1,<2", "defusedxml>=0.7,<1", "striprtf>=0.0.29,<1",
  "xlrd>=2,<3", "olefile>=0.47,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-xdist>=3.8,<4", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.isort]
known-first-party = ["app"]
